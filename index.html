<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="El Efecto Stendhal. Estamos diseñando tu próximo evento."
    />
    <meta property="og:title" content="El Efecto Stendhal" />
    <meta property="og:description" content="Estamos diseñando tu próximo evento." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/poster.jpg" />
    <title>El Efecto Stendhal</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <div class="logo">
          <img
            src="assets/logo.png"
            alt="El Efecto Stendhal"
            width="128"
            height="70"
          />
        </div>
        <h1>Estamos diseñando<br />tu próximo evento</h1>
        <address class="contact">
          <a href="mailto:eventos@elefectostendhal.com">eventos@elefectostendhal.com</a>
          <a href="tel:+34633340905">+34 633 34 09 05</a>
        </address>
      </header>

      <section class="showreel" aria-label="Showreel">
        <div class="showreel__frame">
          <video
            class="showreel__video"
            poster="assets/poster.jpg"
            preload="auto"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            disablepictureinpicture
            controlslist="nodownload nofullscreen noremoteplayback"
            aria-label="Showreel de El Efecto Stendhal"
            data-video
          >
            <source src="assets/efecto-stendhal.mp4" type="video/mp4" />
          </video>
          <div class="showreel__fade" aria-hidden="true"></div>
          <button type="button" class="showreel__playback" data-playback aria-label="Pausar showreel">
            <img class="showreel__play" src="assets/play.svg" alt="" width="64" height="64" />
          </button>
          <button type="button" class="showreel__sound" data-sound aria-label="Activar sonido" aria-pressed="false">
            <svg class="showreel__sound-off" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4.1 9.1v5.8h3.3L13 20V4L7.4 9.1H4.1Zm14.2 8.3-1.3-1.3A5.4 5.4 0 0 0 18.4 12a5.4 5.4 0 0 0-1.4-4.1l1.3-1.3A7.2 7.2 0 0 1 20.2 12a7.2 7.2 0 0 1-1.9 5.4ZM5.3 3.2 20.8 18.7l-1.4 1.4L3.9 4.6 5.3 3.2Z"
              />
            </svg>
            <svg class="showreel__sound-on" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4.1 9.1v5.8h3.3L13 20V4L7.4 9.1H4.1Zm12.7 1.2A3.6 3.6 0 0 1 18 12a3.6 3.6 0 0 1-1.2 1.7l-1.2-1.2.4-.5-.4-.5 1.2-1.2Zm2.6-2.6A7.2 7.2 0 0 1 21.3 12a7.2 7.2 0 0 1-1.9 5.3l-1.3-1.3A5.4 5.4 0 0 0 19.5 12a5.4 5.4 0 0 0-1.4-4.1l1.3-1.3Z"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
